name: GraphQL Basic Test
description: Demonstrates GraphQL body type, assertions, and exports

variables:
  graphql_url:
    type: string
    value: "https://api.example.com/graphql"
  user_id:
    type: string
    value: "123"

suites:
  - name: GraphQL Queries
    cases:
      - title: Get User by ID
        request:
          url: "${graphql_url}"
          body:
            type: graphql
            query: |
              query GetUser($id: ID!) {
                user(id: $id) {
                  id
                  name
                  email
                }
              }
            variables:
              id: "${user_id}"
            operation_name: GetUser
          assertions:
            status: 200
            graphql:
              no_errors: true
              data:
                "$.user.id": "${user_id}"
                "$.user.email": "/.+@.+/"
          export:
            graphql:
              - path: "$.user.name"
                as: "user_name"

      - title: Get User with exported name
        request:
          url: "${graphql_url}"
          body:
            type: graphql
            query: |
              query SearchUsers($name: String!) {
                searchUsers(name: $name) {
                  id
                  name
                }
              }
            variables:
              name: "${user_name}"
          assertions:
            status: 200
            graphql:
              no_errors: true
