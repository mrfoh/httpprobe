name: Test Action

on:
  pull_request:
    paths:
      - '.github/actions/setup/**'
      - '.github/workflows/test-action.yml'
  push:
    branches: [main]
    paths:
      - '.github/actions/setup/**'
      - '.github/workflows/test-action.yml'
  workflow_dispatch:

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install httpprobe
        id: setup
        uses: ./.github/actions/setup
        with:
          version: latest
      - name: Print resolved version
        shell: bash
        run: |
          echo "Installed ${{ steps.setup.outputs.version }}"
          httpprobe --version
          httpprobe --help
      - name: Run a sample test
        shell: bash
        run: httpprobe run -p samples/simple.test.yaml
